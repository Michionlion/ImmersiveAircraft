name: GitHub Release

on:
  push:
    tags: "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate and split tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+(.+)$ ]]; then
            echo "Tag '${TAG}' does not match <major>.<minor>.<patch>+<mc-version>"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          MC_VERSION="${BASH_REMATCH[4]}"
          MOD_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "minor=${MINOR}" >> "${GITHUB_OUTPUT}"
          echo "patch=${PATCH}" >> "${GITHUB_OUTPUT}"
          echo "mod_version=${MOD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "mc_version=${MC_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release jars
        run: ./gradlew --no-daemon clean build

      - name: Rename jars for release assets
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FABRIC_INPUT="fabric/build/libs/immersive_aircraft-${TAG}.jar"
          NEOFORGE_INPUT="neoforge/build/libs/immersive_aircraft-${TAG}.jar"
          FABRIC_OUTPUT="fabric/build/libs/immersive_aircraft-${TAG}-fabric.jar"
          NEOFORGE_OUTPUT="neoforge/build/libs/immersive_aircraft-${TAG}-neoforge.jar"

          test -f "${FABRIC_INPUT}" || { echo "Missing ${FABRIC_INPUT}"; ls -la fabric/build/libs; exit 1; }
          test -f "${NEOFORGE_INPUT}" || { echo "Missing ${NEOFORGE_INPUT}"; ls -la neoforge/build/libs; exit 1; }

          mv "${FABRIC_INPUT}" "${FABRIC_OUTPUT}"
          mv "${NEOFORGE_INPUT}" "${NEOFORGE_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Immersive Aircraft ${{ steps.tag.outputs.mod_version }} (MC ${{ steps.tag.outputs.mc_version }})
          generate_release_notes: true
          files: |
            fabric/build/libs/immersive_aircraft-${{ steps.tag.outputs.tag }}-fabric.jar
            neoforge/build/libs/immersive_aircraft-${{ steps.tag.outputs.tag }}-neoforge.jar
